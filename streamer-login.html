<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer-Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0b0620; --mid:#170b34; --panel:#1c0f3d;
    --pink:#ff3ec8; --cyan:#35e6ff; --purple:#8b5cf6;
    --paper:#f3eefc; --line:rgba(243,238,252,0.15);
    --ok:#35e6ae; --err:#ff5c7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,62,200,0.22), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(53,230,255,0.14), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(139,92,246,0.20), transparent 55%),
      linear-gradient(180deg, var(--deep), var(--mid) 55%, var(--deep));
    color:var(--paper); font-family:'Inter', sans-serif;
    display:flex; justify-content:center; align-items:center;
    padding:24px; position:relative; overflow-x:hidden;
  }
  .card{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:linear-gradient(180deg, rgba(28,15,61,0.9), rgba(17,9,40,0.94));
    border:1px solid var(--line); border-radius:26px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5); overflow:hidden;
    text-align:center; padding:44px 34px 38px;
  }
  .icon{
    width:64px; height:64px; margin:0 auto 18px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-size:2rem;
    background:linear-gradient(135deg, var(--pink), var(--purple));
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem; letter-spacing:0.12em;
    color:var(--cyan); text-transform:uppercase; margin:0 0 10px;
  }
  h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:1.4rem; margin:0 0 8px; }
  p.desc{ margin:0 0 26px; opacity:0.72; font-size:0.92rem; line-height:1.5; }

  .field{ text-align:left; margin-bottom:18px; }
  .field label{
    display:block; font-family:'Sora', sans-serif; font-weight:600; font-size:0.92rem;
    margin-bottom:7px; color:var(--cyan);
  }
  input[type=password]{
    width:100%; background:rgba(243,238,252,0.05); border:1.5px solid var(--line);
    border-radius:12px; padding:13px 14px; color:var(--paper);
    font-family:'JetBrains Mono', monospace; font-size:1rem; outline:none;
    letter-spacing:0.05em;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:rgba(243,238,252,0.35); }
  input:focus{ border-color:var(--pink); background:rgba(255,62,200,0.06); box-shadow:0 0 0 3px rgba(255,62,200,0.1); }
  input.shake{ animation:shake .3s ease; border-color:var(--err); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  button{
    width:100%; font-family:'Sora', sans-serif; font-weight:700; font-size:1.02rem;
    padding:15px 20px; border:none; border-radius:14px; cursor:pointer;
    color:#100722; background:linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow:0 14px 30px rgba(255,62,200,0.25);
    transition:filter .12s ease, transform .1s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:translateY(2px); }

  .status{ min-height:20px; margin-top:14px; font-weight:700; font-size:0.85rem; color:var(--err); }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🔐</div>
  <p class="eyebrow">Nur für dich</p>
  <h1>Streamer-Login</h1>
  <p class="desc">Passwort eingeben, um zur Steuerseite für die Mitspielen-Anmeldung zu kommen.</p>

  <form id="login-form">
    <div class="field">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" placeholder="••••••••" required autofocus>
    </div>
    <button type="submit">Einloggen</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
  // ===================== KONFIGURATION =====================
  // Passwort hier ändern. Achtung: Das ist eine reine Zugangssperre für Zuschauer,
  // keine echte Sicherheitslösung — wer sich den Seitencode ansieht, kann es auslesen.
  const STREAM_PASSWORD = "Root123!";

  // Wohin es nach erfolgreichem Login weitergeht.
  const REDIRECT_TO = "anmeldung-oeffnen.html";

  // Muss zum KEY in anmeldung-oeffnen.html passen.
  const AUTH_KEY = "streamer_login_ok";
  // ===========================================================

  const form = document.getElementById('login-form');
  const pwInput = document.getElementById('pw');
  const statusEl = document.getElementById('status');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (pwInput.value === STREAM_PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, 'true');
      window.location.href = REDIRECT_TO;
    } else {
      statusEl.textContent = 'Falsches Passwort. Nochmal versuchen.';
      pwInput.classList.remove('shake');
      void pwInput.offsetWidth; // reflow, damit die Shake-Animation erneut abspielt
      pwInput.classList.add('shake');
      pwInput.value = '';
      pwInput.focus();
    }
  });
</script>

</body>
</html>
